---
# Gateway deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: {{ $.Release.namespace }}
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/component: server
    spec:
      volumes:
        - name: certificate-volume
          secret:
            secretName: llm-gatewaysaml-secret
{{- if .Values.dev_mode }}   
        - name: saml-settings
          configMap: # or secret if the file is in a secret
            name: saml-settings-map
            items:
              - key: settings.json
                path: settings.json
{{- end }}          
      containers:
        - name: gateway
          image: "{{ .Values.gateway_image_url }}:{{ .Values.gateway_image_tag }}" #Lets start versioning this
          # Make sure, that the image is always pulled, since we might update for fixes
          imagePullPolicy: Always 
          ports:
            - containerPort: 3000
          resources:
            requests:
              # Maybe needs to be increased later on.
              cpu: 2
          env:
            # Mongo settings ( port will be default )
            - {
                name: POSTGRESUSER,
                value: {{ .Values.postgres_user }} 
              }
            - {
                name: POSTGRESPASSWORD,
                valueFrom: { secretKeyRef: { name: llm-gateway-databases, key: postgres_password } },
              }
            - { name: POSTGRESHOST, value: "llm-postgres-svc" }            
            - { name: POSTGRESDB, value: {{ .Values.postgres_db_name }} }            
            # Redis
            - { name: REDISHOST, value: "llm-redis-svc" }
            - { name: REDISPORT, value: "6379" }
            - {
                name: REDISPASSWORD,
                valueFrom:
                  { secretKeyRef: { name: databases, key: redispassword } },
              }            
            # This is the admin key, which allows generation/removal of additional keys
            - {
                name: ADMIN_KEY,
                valueFrom:
                  { secretKeyRef: { name: llm-gateway, key: gateway_key } },
              }
            # This is the key for the INFERENCE Server
            - {
                name: INFERENCE_KEY,
                valueFrom:
                  { secretKeyRef: { name: llm-gateway, key: inference_key } },
              }
            # This is the session key
            - {
                name: SESSION_KEY,
                valueFrom:
                  { secretKeyRef: { name: llm-gateway, key: session_key } },
              }
            - name: CORS_ORIGINS
              value: '{{ toJson .Values.cors_origins }}'
            - {
                name: POPUPLOGIN,
                value: "1",
              }              
          volumeMounts:
            - mountPath: /usr/src/app/app/security/saml_data/certs
              name: certificate-volume
              readOnly: true
{{- if .Values.dev_mode }}   
            - name: saml-settings
              mountPath: /usr/src/app/app/security/saml_data/settings.json
              subPath: settings.json
{{- end }}