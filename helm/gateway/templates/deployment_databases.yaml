---
# redis database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-redis
  namespace: {{ $.Release.namespace }}
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: llm-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: llm-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/name: llm-redis
    spec:
      containers:
        - name: llm-redis-db
          image: redis:7.2.3
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 2
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: databases
                  key: redispassword
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]          

---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-postgres
  namespace: {{ $.Release.namespace }}
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: llm-postgres
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: llm-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/name: llm-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/postgres:17.6
          env:
            - {
                name: POSTGRES_USER,
                value: {{ .Values.postgres_user }}                
              }
            - {
                name: POSTGRES_PASSWORD,
                valueFrom: { secretKeyRef: { name: llm-gateway-databases, key: postgresql_password } },
              }
            - {
                name: POSTGRES_DB,
                value: {{ .Values.postgres_db_name}}
            }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: llm-postgres-pvc
