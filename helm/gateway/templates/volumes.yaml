---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-postgres-pvc
  namespace: {{ $.Release.namespace }}
spec:
  accessModes: 
    - ReadWriteOnce # This should only ever be accessed by one mongoDB server instance
  resources:
    requests:
      # Need to have a look how big this will become.
      storage: 10Gi  
  

